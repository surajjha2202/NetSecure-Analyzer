services:

  postgres:
    image: postgres:17
    container_name: netsecure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netsecure
      POSTGRES_USER: netsecure
      POSTGRES_PASSWORD: netsecure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: netsecure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    image: netsecure-backend:latest
    container_name: netsecure-backend
    restart: unless-stopped

    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env
    environment:
      APP_NAME: NetSecure Analyzer
      APP_VERSION: "1.0.0"
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://netsecure:netsecure@postgres:5432/netsecure
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: