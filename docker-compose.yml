services:

  postgres:
    image: postgres:17
    container_name: netsecure-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: netsecure
      POSTGRES_USER: netsecure
      POSTGRES_PASSWORD: netsecure

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:8
    container_name: netsecure-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data: